# dsh-bridge：让 headless profile 复用桌面端已保存的凭据
# 来源：并非自创，直接取自 DSH 自带的 @deepseek-ai/dsh-headless 官方 README「凭据」节
#       （headless profile 默认停用了托管凭据存储服务，这三行开关把默认停用的服务重新打开，否则报 MISSING_CREDENTIAL）。
# 本文件不含任何本机路径，桥在派任务前原样落盘到 DSH_BRIDGE_CRED_PATCH（可通过 DSH_BRIDGE_DISABLE_CRED_PATCH=1 禁用）。
- id: credentials
  disabled: false
- id: authorization
  disabled: false
- id: deepseek-account
  disabled: false
