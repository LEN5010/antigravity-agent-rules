# dsh-crew：可选的模型补丁，默认走 Command Code 的 DeepSeek V4.1 Flash Fast (latest)
# 依据：dsh-commandcode bundle patch
# 只有 DSH_CREW_COMMANDCODE_PLUGIN（默认 ~/.dsh/profiles/desktop/node_modules/dsh-commandcode/index.js）
# 存在时，桥才会把本文件落盘并作为第二个 --patch 传给 headless；否则沿用 DSH 自身的默认模型。
# <COMMANDCODE_PLUGIN_URL> 由桥用 pathToFileURL 替换：Windows 为 file:///C:/...，macOS 为 file:///Users/...
- insert:
    - id: commandcode-provider
      name: '<COMMANDCODE_PLUGIN_URL>'
      config:
        include: 'glm-5.3, deepseek-v4.1'
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: commandcode
    model: deepseek/deepseek-v4.1-flash-fast
