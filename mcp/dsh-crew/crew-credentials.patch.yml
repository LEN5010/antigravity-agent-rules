# dsh-crew：让 headless profile 复用桌面端已保存的凭据，并默认走 Command Code 的 DeepSeek V4.1 Flash Fast (latest)
# 依据：@deepseek-ai/dsh-headless README「凭据」节 + dsh-commandcode bundle patch
# 注意：<YOUR_HOME> 是占位符，桥在落盘到 ~/.dsh/dsh-crew/ 前会自动替换成本机家目录，
#       所以本文件可以直接进版本库，不必手工改。
- id: credentials
  disabled: false
- id: authorization
  disabled: false
- id: deepseek-account
  disabled: false
- insert:
    - id: commandcode-provider
      name: 'file:///<YOUR_HOME>/.dsh/profiles/desktop/node_modules/dsh-commandcode/index.js'
      config:
        include: 'glm-5.3, deepseek-v4.1'
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: commandcode
    model: deepseek/deepseek-v4.1-flash-fast
