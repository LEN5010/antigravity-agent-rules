# dsh-crew：让 headless profile 复用桌面端已保存的凭据
# 依据：@deepseek-ai/dsh-headless README「凭据」节（headless 默认禁用托管凭据存储，不加会报 MISSING_CREDENTIAL）
# 本文件不含任何本机路径，桥每次派任务前原样落盘到 DSH_CREW_CRED_PATCH。
# 默认模型的切换放在 crew-commandcode.patch.yml，只有本机装了 dsh-commandcode 插件时才叠加。
- id: credentials
  disabled: false
- id: authorization
  disabled: false
- id: deepseek-account
  disabled: false
